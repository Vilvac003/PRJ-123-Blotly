<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="880" height="270" rx="14" fill="#faf8f4"/><text x="30" y="32" font-size="17" font-weight="800" fill="#14202e">Spínanie bielej LED (návrh)</text><text x="80" y="82" font-size="13" font-weight="700" fill="#14202e">+5 V</text><line x1="120" y1="78" x2="190" y2="78" stroke="#14202e" stroke-width="2.2"/><rect x="190" y="66" width="70" height="24" rx="4" fill="#fff" stroke="#14202e" stroke-width="2"/><text x="225" y="83" text-anchor="middle" font-size="12.5">100 Ω</text><line x1="260" y1="78" x2="330" y2="78" stroke="#14202e" stroke-width="2.2"/><polygon points="330,62 330,94 360,78" fill="#f4b942" stroke="#14202e" stroke-width="2"/><line x1="360" y1="62" x2="360" y2="94" stroke="#14202e" stroke-width="2.4"/><text x="345" y="112" text-anchor="middle" font-size="12.5">LED</text><line x1="360" y1="78" x2="440" y2="78" stroke="#14202e" stroke-width="2.2"/><line x1="440" y1="78" x2="440" y2="130" stroke="#14202e" stroke-width="2.2"/><circle cx="460" cy="160" r="30" fill="#fff" stroke="#14202e" stroke-width="2"/><text x="460" y="157" text-anchor="middle" font-size="12">2N2222</text><text x="460" y="172" text-anchor="middle" font-size="11" fill="#5d6a7a">NPN</text><line x1="440" y1="130" x2="448" y2="136" stroke="#14202e" stroke-width="2.2"/><text x="478" y="124" font-size="12" fill="#5d6a7a">kolektor</text><line x1="460" y1="190" x2="460" y2="228" stroke="#14202e" stroke-width="2.2"/><text x="475" y="212" font-size="12" fill="#5d6a7a">emitor</text><line x1="440" y1="228" x2="480" y2="228" stroke="#14202e" stroke-width="2.4"/><line x1="448" y1="236" x2="472" y2="236" stroke="#14202e" stroke-width="2.2"/><line x1="456" y1="244" x2="464" y2="244" stroke="#14202e" stroke-width="2"/><text x="500" y="233" font-size="13" font-weight="700">GND</text><line x1="250" y1="160" x2="430" y2="160" stroke="#14202e" stroke-width="2.2"/><rect x="170" y="148" width="80" height="24" rx="4" fill="#fff" stroke="#14202e" stroke-width="2"/><text x="210" y="165" text-anchor="middle" font-size="12.5">1 kΩ</text><line x1="120" y1="160" x2="170" y2="160" stroke="#14202e" stroke-width="2.2"/><text x="48" y="165" font-size="13" font-weight="700" fill="#14202e">GPIO</text><text x="590" y="100" font-size="13" fill="#5d6a7a">Prúd LED ≈ 18 mA (zo zoznamu</text><text x="590" y="118" font-size="13" fill="#5d6a7a">súčiastok). 3,3 V pin priamo</text><text x="590" y="136" font-size="13" fill="#5d6a7a">dáva slabé a nestabilné svetlo,</text><text x="590" y="154" font-size="13" fill="#5d6a7a">čo skresľuje meranie.</text></svg>